<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <pattern id="gridSmall" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e8f1ff" stroke-width="1" stroke-opacity="0.08"/>
    </pattern>
    <pattern id="gridLarge" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#e8f1ff" stroke-width="1" stroke-opacity="0.16"/>
    </pattern>
    <g id="cross">
      <line x1="-9" y1="0" x2="9" y2="0" stroke="#ffb454" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="-9" x2="0" y2="9" stroke="#ffb454" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- background sheet -->
  <rect x="0" y="0" width="1200" height="300" fill="#0a2f52"/>
  <rect x="0" y="0" width="1200" height="300" fill="url(#gridSmall)"/>
  <rect x="0" y="0" width="1200" height="300" fill="url(#gridLarge)"/>

  <!-- drawing-sheet border -->
  <rect x="28" y="28" width="1144" height="244" rx="6" fill="none" stroke="#e8f1ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="40" y="40" width="1120" height="220" rx="4" fill="none" stroke="#e8f1ff" stroke-width="1" stroke-opacity="0.28"/>

  <!-- registration crosshairs -->
  <use href="#cross" transform="translate(28,28)"/>
  <use href="#cross" transform="translate(1172,28)"/>
  <use href="#cross" transform="translate(28,272)"/>
  <use href="#cross" transform="translate(1172,272)"/>

  <!-- corner annotations, like a drawing-sheet stamp -->
  <text x="52" y="55" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace"
        font-size="12" letter-spacing="1.5" fill="#9fb8d4" fill-opacity="0.85">NO. BP-001</text>
  <text x="1148" y="55" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace"
        font-size="12" letter-spacing="1.5" fill="#9fb8d4" fill-opacity="0.85">SCALE&#160;&#160;NTS</text>
  <text x="52" y="252" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace"
        font-size="12" letter-spacing="0.5" fill="#9fb8d4" fill-opacity="0.85">github.com/arogozhnikov/blueprint</text>
  <!-- <text x="1148" y="252" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace"
        font-size="12" letter-spacing="1.5" fill="#9fb8d4" fill-opacity="0.85">REV&#160;&#160;0.1.0</text> -->

  <!-- wordmark -->
  <text x="600" y="178" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace"
        font-size="96" font-weight="700" letter-spacing="1" fill="#eef5fd">blueprint</text>

  <!-- dimension line under wordmark -->
  <g stroke="#ffb454" stroke-width="1.6" fill="none" stroke-linecap="round">
    <line x1="336" y1="206" x2="864" y2="206"/>
    <line x1="336" y1="199" x2="336" y2="213"/>
    <line x1="864" y1="199" x2="864" y2="213"/>
    <path d="M336,206 l14,-7 M336,206 l14,7"/>
    <path d="M864,206 l-14,-7 M864,206 l-14,7"/>
  </g>

  <!-- vertical dimension line to the left of "b" -->
  <g stroke="#ffb454" stroke-width="1.6" fill="none" stroke-linecap="round">
    <line x1="308" y1="60" x2="308" y2="207"/>
    <line x1="301" y1="89" x2="315" y2="89"/>
    <line x1="301" y1="178" x2="315" y2="178"/>
    <path d="M308,89 l-7,-14 M308,89 l7,-14"/>
    <path d="M308,178 l-7,14 M308,178 l7,14"/>
  </g>

  <!-- tagline -->
  <text x="600" y="234" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace"
        font-size="15" letter-spacing="3" fill="#9fb8d4">TYPED&#160;&#183;&#160;IMMUTABLE-BY-DEFAULT&#160;&#183;&#160;PYTHON CONFIGS</text>
</svg>
