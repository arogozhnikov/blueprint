[build-system]
requires = ["hatchling~=1.25"]
build-backend = "hatchling.build"

[project]
name = "blueprint"
version = "0.1.0"
description = "Typed, immutable-by-default config objects for Python."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alex Rogozhnikov"},
]
keywords = ["config", "configuration", "dataclass", "typing", "validation", "immutable"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/arogozhnikov/blueprint"
Repository = "https://github.com/arogozhnikov/blueprint"
Issues = "https://github.com/arogozhnikov/blueprint/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff~=0.15.8",
    "pyrefly~=1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blueprint"]

[tool.pytest.ini_options]
testpaths = ["src/blueprint"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
