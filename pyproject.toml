[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blueprint"
version = "0.1.0"
description = "Typed, immutable-by-default config objects for Python."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Alex"},
]
keywords = ["config", "configuration", "dataclass", "typing", "validation", "immutable"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff~=0.15.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blueprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
